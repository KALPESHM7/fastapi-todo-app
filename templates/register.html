<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - To-Do App</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your To-Do List account
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="post"
                action="/register"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Login here
                </a>

            </p>

        </div>

    </div>

</body>

</html>
